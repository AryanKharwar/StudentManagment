<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8 6 13l10 5 10-5-10-5zM10 16v4c3 2.5 9 2.5 12 0v-4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body data-area="admin" data-page="deletestudent.html">
<main class="center">
<div class="card narrow">
    <div class="card-top">
        <span class="ic lg danger" data-icon="trash"></span>
        <div><h1>Delete student</h1><p class="sub">Remove a student record by its ID.</p></div>
    </div>
    <div class="callout danger" style="margin-bottom:20px"><span data-icon="warn"></span>
        <div><b>This cannot be undone</b><p>This permanently removes the student record.</p></div></div>
    <form action="/deletestudent" method="post" id="deleteForm" class="stack">
        <div class="field"><label for="id">Student ID</label>
            <div class="input-wrap has-icon"><span class="lead" data-icon="hash"></span>
                <input type="number" id="id" name="id" placeholder="Enter Student ID" min="1" required></div></div>
        <button type="submit" class="btn danger lg block" id="deleteBtn"><span data-icon="trash" style="display:contents"></span>Delete student</button>
    </form>
    <div class="links"><a href="admin.html">Back to dashboard</a></div>
</div>
</main>
<script src="csrf.js"></script>
<script>
// Ask for confirmation first, then send the normal form (the token is already in it)
const form = document.getElementById("deleteForm");
form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (form.dataset.busy) { return; }
    const id = document.getElementById("id").value;
    const ok = await confirmDialog("Delete student?", "Student ID " + id + " will be permanently deleted.", "Delete");
    if (!ok) { return; }
    form.dataset.busy = "1";
    setLoading(document.getElementById("deleteBtn"), true);
    form.submit();
});
window.addEventListener("pageshow", () => { delete form.dataset.busy; setLoading(document.getElementById("deleteBtn"), false); });
</script>
</body>
</html>
