spring.application.name=crudoperation

# Database settings are read from ENVIRONMENT VARIABLES so no password is stored in this file.
# DB_URL and DB_USERNAME have defaults (your current values). DB_PASSWORD has NO default: you must set it.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/school
spring.datasource.username=root
spring.datasource.password=aryan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=9090

# Admin login session (server-side session, kept in memory)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Public admin registration. Set the environment variable ADMIN_REGISTRATION_OPEN=false
# after your admin account exists, so strangers cannot create admin accounts.
app.admin.registration-open=${ADMIN_REGISTRATION_OPEN:true}
