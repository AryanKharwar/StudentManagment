<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8 6 13l10 5 10-5-10-5zM10 16v4c3 2.5 9 2.5 12 0v-4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body data-area="admin" data-page="updatestudent.html">
<main>
<a class="back-link" href="admin.html"><span data-icon="back" style="display:contents"></span>Back to dashboard</a>
<div class="card form-card">
    <div class="form-card-head">
        <span class="ic lg" data-icon="edit"></span>
        <div><h1>Update student</h1><p class="sub" id="note">Change the details below, then save.</p></div>
    </div>
    <form action="/updateSt" method="post" data-loading>
        <section class="form-section">
            <div><h2>Student identity</h2><p>The ID is unique to each student.</p></div>
            <div class="form-grid">
                <div class="field"><label for="id">Student ID</label>
                    <input type="number" id="id" name="id" placeholder="e.g. 101" min="1" required></div>
                <div class="field"><label for="name">Student name</label>
                    <input type="text" id="name" name="name" placeholder="Full name" required></div>
            </div>
        </section>
        <section class="form-section">
            <div><h2>Contact details</h2><p>How to reach the student.</p></div>
            <div class="form-grid">
                <div class="field"><label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required></div>
                <div class="field"><label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" placeholder="Phone number" required></div>
            </div>
        </section>
        <section class="form-section">
            <div><h2>Academic details</h2><p>Course and current semester.</p></div>
            <div class="form-grid">
                <div class="field"><label for="course">Course</label>
                    <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required></div>
                <div class="field"><label for="semester">Semester</label>
                    <input type="number" id="semester" name="semester" placeholder="e.g. 3" min="1" required></div>
            </div>
        </section>
        <div class="form-foot"><a class="btn ghost" href="admin.html">Cancel</a><button type="submit" class="btn">Save changes</button></div>
    </form>
</div>
</main>
<script src="csrf.js"></script>
<script>
// Pre-fill the form using the existing public /searchstudent endpoint.
// The ID comes from ?id=... (View All page) or from the Update lookup page.
(function () {
    let id = new URLSearchParams(location.search).get("id");
    try {
        if (!id) { id = sessionStorage.getItem("updateId"); }
        sessionStorage.removeItem("updateId");
    } catch (e) { /* storage unavailable */ }
    if (!id) { return; }

    fetch("/searchstudent?id=" + encodeURIComponent(id))
        .then(response => response.text())
        .then(text => {
            if (text.trim() === "") { toast("No student found with ID " + id, "err"); return; }
            const s = JSON.parse(text);
            ["id", "name", "email", "course", "semester", "phone"].forEach(field => {
                document.getElementById(field).value = s[field] === null || s[field] === undefined ? "" : s[field];
            });
            document.getElementById("id").readOnly = true;   // the ID identifies the record, so it stays fixed
            document.getElementById("note").textContent = "Editing student " + s.id + ". The ID cannot be changed.";
        })
        .catch(() => toast("Could not load the student's details. You can still type them in.", "err"));
})();
</script>
</body>
</html>
